		<!-- Anti-flash: set data-theme before first paint so the page never flashes
		     the wrong theme. Mirrors the logic in src/hooks/useTheme.js. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('algdatviz:theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia &&
								  window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
