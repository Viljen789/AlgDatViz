		<!-- Anti-flash: resolve mode and palette before first paint. Mirrors
		     the logic in src/hooks/useTheme.js. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('algdatviz:theme');
					var theme = stored === 'dark' ? 'dark' : 'light';
					document.documentElement.dataset.theme = theme;
					var storedPalette = localStorage.getItem('algdatviz:palette');
					document.documentElement.dataset.palette =
						storedPalette === 'editorial' ? 'editorial' : 'neutral';
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
					document.documentElement.dataset.palette = 'neutral';
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&display=swap"
			rel="stylesheet"
